<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Smitten Singles</title>
<meta name="theme-color" content="#C6302C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Smitten Singles">
<link rel="manifest" href="/smitten-event-app/manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f7f7f7;color:#1a1a1a;min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:1.5rem 1rem}
.logo{text-align:center;margin-bottom:1.5rem}
.logo h1{font-size:22px;font-weight:700;color:#C6302C}
.logo p{font-size:13px;color:#666;margin-top:4px}
.card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:1.25rem;margin-bottom:1rem}
input,select{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:15px;background:#fafafa;color:#1a1a1a;outline:none;margin-bottom:10px}
input:focus,select:focus{border-color:#C6302C}
.btn{display:block;width:100%;padding:12px;background:#C6302C;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;text-align:center}
.btn:hover{background:#a8231f}
.btn:disabled{background:#ccc;cursor:not-allowed}
.btn-gray{background:#888}.btn-gray:hover{background:#555}
.btn-outline{background:#fff;color:#C6302C;border:1px solid #C6302C;display:inline-block;width:auto;padding:7px 14px;font-size:13px}
.nav{display:flex;border-bottom:1px solid #e8e8e8;margin-bottom:1rem;background:#fff;position:sticky;top:0;z-index:10}
.nt{flex:1;padding:11px 4px;background:transparent;border:none;font-size:13px;cursor:pointer;color:#999;border-bottom:2px solid transparent;white-space:nowrap}
.nt.on{color:#C6302C;border-bottom-color:#C6302C;font-weight:600}
.nt-so{flex:none;padding:11px 12px;background:transparent;border:none;font-size:13px;cursor:pointer;color:#999;border-bottom:2px solid transparent}
.row{padding:12px 0;border-bottom:1px solid #f2f2f2}.row:last-child{border-bottom:none}
.top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#eee;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;color:#999}
.opts{display:flex;gap:5px;padding-left:56px}
.opt{flex:1;padding:6px 2px;border-radius:8px;border:1px solid #ddd;background:transparent;font-size:11px;font-weight:600;cursor:pointer;color:#999;text-align:center}
.opt.sd{background:#C6302C;border-color:#C6302C;color:#fff}
.opt.sf{background:#185FA5;border-color:#185FA5;color:#fff}
.opt.sn{background:#777;border-color:#777;color:#fff}
.opt.sx{background:#eee;border-color:#ddd;color:#999}
.al{padding:10px 14px;border-radius:8px;font-size:14px;margin-bottom:10px}
.ok{background:#e8f5e9;color:#2e7d32}.er{background:#fdecea;color:#b71c1c}.inf{background:#e3f2fd;color:#1565c0}
.mrow{padding:12px 0;border-bottom:1px solid #f2f2f2}.mrow:last-child{border-bottom:none}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600}
.pd{background:#fdecea;color:#b71c1c}.pf{background:#e3f2fd;color:#1565c0}
.cbtn{margin-top:8px;padding:6px 14px;border-radius:8px;border:1px solid #C6302C;background:transparent;color:#C6302C;font-size:13px;cursor:pointer;font-weight:500}
.cbtn:hover{background:#C6302C;color:#fff}
.bbl{padding:8px 12px;border-radius:16px;font-size:14px;max-width:78%;line-height:1.4;margin-bottom:4px}
.bm{background:#C6302C;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.bt{background:#efefef;color:#1a1a1a;align-self:flex-start;border-bottom-left-radius:4px}
.ts{font-size:11px;color:#bbb;text-align:center;margin:2px 0 8px}
.ci{display:flex;gap:8px;margin-top:8px}.ci input{flex:1;margin:0}
.sb2{padding:10px 14px;background:#C6302C;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:15px}
.empty{text-align:center;padding:2rem 1rem;color:#999;font-size:14px}
.sp{display:inline-block;width:16px;height:16px;border:2px solid rgba(198,48,44,.2);border-top-color:#C6302C;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.leg{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;font-size:12px;color:#888}
.ld{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px}
.pp{width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid #eee}
.upbtn{margin-top:8px;padding:7px 14px;border:1px solid #C6302C;background:transparent;color:#C6302C;border-radius:8px;font-size:13px;cursor:pointer}
.sl{font-size:12px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
</style>
</head>
<body>
<div class="app">
<div class="logo"><h1>Smitten Singles</h1><p>Omaha Speed Dating &middot; Ages 35&ndash;55 &middot; May 11</p></div>

<div id="vl">
  <div class="card">
    <p class="sl">Sign in</p>
    <p style="font-size:14px;color:#666;margin-bottom:1rem">Enter your email to get a magic link. No password needed.</p>
    <input type="email" id="ei" placeholder="your@email.com">
    <button class="btn" id="lb" onclick="doMagic()">Send magic link</button>
    <div id="lm" style="margin-top:10px"></div>
  </div>
  <p style="font-size:12px;color:#bbb;text-align:center">You must be registered for tonight's event.</p>
</div>

<div id="vc" style="display:none">
  <div class="card" style="text-align:center;padding:2.5rem">
    <span class="sp" style="width:24px;height:24px"></span>
    <p style="margin-top:1rem;color:#888;font-size:14px">Signing you in&hellip;</p>
  </div>
</div>

<div id="vm" style="display:none">
  <div class="nav">
    <button class="nt on" id="tp" onclick="tab('p')">&#10084; Pick</button>
    <button class="nt" id="tm" onclick="tab('m')">&#10024; Matches</button>
    <button class="nt" id="tc" onclick="tab('c')">&#128172; Chat</button>
    <button class="nt" id="tpr" onclick="tab('pr')">&#128100; Me</button>
    <button class="nt-so" onclick="signOut()">Sign out</button>
  </div>

  <div id="pp">
    <div id="pa"></div>
    <div class="leg">
      <span><span class="ld" style="background:#C6302C"></span>Date</span>
      <span><span class="ld" style="background:#185FA5"></span>Friend</span>
      <span><span class="ld" style="background:#777"></span>Not again</span>
    </div>
    <div class="card" style="padding:.75rem 1.25rem"><div id="al"><div class="empty"><span class="sp"></span></div></div></div>
    <button class="btn" id="sb" onclick="savePicks()">Save my picks</button>
    <p style="font-size:12px;color:#bbb;text-align:center;margin-top:8px">You can update your picks until the event ends.</p>
  </div>

  <div id="pm" style="display:none"><div id="mc"></div></div>
  <div id="pcc" style="display:none"><div id="ch-list"></div><div id="ch"><div class="empty" style="display:none"></div></div></div>

  <div id="ppr" style="display:none">
    <div class="card">
      <p class="sl">My photo</p>
      <div id="ppw"><div class="av" id="pph" style="width:80px;height:80px;font-size:28px">?</div></div>
      <div style="margin-top:10px">
        <input type="file" id="pf" accept="image/*" style="display:none;margin:0" onchange="upPhoto(this)">
        <button class="upbtn" onclick="document.getElementById('pf').click()">&#128247; Upload photo</button>
        <div id="phm" style="margin-top:8px;font-size:13px"></div>
      </div>
    </div>
    <div class="card">
      <p class="sl">My info</p>
      <label style="font-size:13px;color:#888;display:block;margin-bottom:4px">Date of birth</label>
      <input type="date" id="pdob" style="margin-bottom:12px">
      <label style="font-size:13px;color:#888;display:block;margin-bottom:4px">Gender</label>
      <select id="pgender" style="margin-bottom:12px">
        <option value="">Select gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Non-binary">Non-binary</option>
        <option value="Prefer not to say">Prefer not to say</option>
      </select>
      <button class="btn" onclick="saveProfile()">Save</button>
      <div id="profmsg" style="margin-top:8px;font-size:13px"></div>
    </div>
    <button class="btn btn-gray" onclick="signOut()">Sign out of event</button>
  </div>
</div>
</div>

<script>
var S='https://qgctltxcgsnbrdtbhmay.supabase.co';
var AN='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFnY3RsdHhjZ3NuYnJkdGJobWF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwMjgwNTcsImV4cCI6MjA5MDYwNDA1N30.-TS1CofnGMGAj38OrZAvtphbHPXQWZWtysO83_960M4';
var EV='d2b033e6-a79f-44e1-8282-f030bea541c0';
var REDIRECT='https://event-app.smittensingles.com';
var SES=null,UID=null,PRF=null,PX={},ACH=null,MATCHES_RELEASED=false;

function hd(x){return Object.assign({'Content-Type':'application/json',apikey:AN,Authorization:'Bearer '+(SES&&SES.t||AN)},x||{})}
function api(p,o){return fetch(S+p,Object.assign({headers:hd()},o||{}))}
function sv(v){['vl','vc','vm'].forEach(function(n){document.getElementById(n).style.display=n===v?'':'none'})}

async function doMagic(){
  var e=document.getElementById('ei').value.trim();
  if(!e)return;
  var b=document.getElementById('lb');
  b.disabled=true;b.innerHTML='<span class="sp"></span>Checking&hellip;';
  var chk=await fetch(S+'/rest/v1/rpc/check_event_registration',{method:'POST',headers:{'Content-Type':'application/json',apikey:AN},body:JSON.stringify({p_email:e,p_event_id:EV})});
  var cd=await chk.json();
  if(!chk.ok||!cd.registered){
    b.disabled=false;b.textContent='Send magic link';
    document.getElementById('lm').innerHTML='<div class="al er">This email isn\'t registered for tonight\'s event. Please see your host.</div>';
    return;
  }
  b.innerHTML='<span class="sp"></span>Sending&hellip;';
  var r=await fetch(S+'/auth/v1/otp',{method:'POST',headers:{'Content-Type':'application/json',apikey:AN},body:JSON.stringify({email:e,options:{emailRedirectTo:REDIRECT}})});
  b.disabled=false;b.textContent='Send magic link';
  document.getElementById('lm').innerHTML=r.ok?'<div class="al ok">Magic link sent! Check your email.</div>':'<div class="al er">Something went wrong. Try again.</div>';
}

async function checkMatchesReleased(){
  var r=await api('/rest/v1/rpc/event_matches_released',{method:'POST',body:JSON.stringify({p_event_id:EV})});
  if(r.ok){var d=await r.json();MATCHES_RELEASED=!!d;}
  if(MATCHES_RELEASED){
    document.getElementById('sb').disabled=true;
    document.getElementById('sb').textContent='Picks are closed';
    document.getElementById('pa').innerHTML='<div class="al inf">Picks are closed. Check your Matches tab!</div>';
    // Disable all pick buttons
    document.querySelectorAll('.opt').forEach(function(b){b.disabled=true;b.style.opacity='0.4';b.style.cursor='not-allowed';});
    // Override pk function to do nothing
    window.pk=function(){};
  }
}

async function init(){
  sv('vc');
  var st=localStorage.getItem('ss_s');
  if(st){try{var d=JSON.parse(st);SES={t:d.t,r:d.r};}catch(e){}}
  // Handle hash token, query token, and PKCE code
  var h=location.hash||'';
  var q=location.search||'';
  var hp=new URLSearchParams(h.slice(1));
  var qp=new URLSearchParams(q.slice(1));
  var at=hp.get('access_token')||qp.get('access_token');
  var rt=hp.get('refresh_token')||qp.get('refresh_token');
  var code=qp.get('code');
  var otp_token=qp.get('token');
  var otp_email=qp.get('email');
  if(at){
    var u=await fetch(S+'/auth/v1/user',{headers:{apikey:AN,Authorization:'Bearer '+at}});
    if(u.ok){SES={t:at,r:rt};localStorage.setItem('ss_s',JSON.stringify({t:at,r:rt}));history.replaceState(null,'',location.pathname);}
  } else if(otp_token&&otp_email){
    // Admin-generated magic link token
    var ex=await fetch(S+'/auth/v1/verify',{method:'POST',headers:{'Content-Type':'application/json',apikey:AN},body:JSON.stringify({token:otp_token,type:'magiclink',email:otp_email})});
    if(ex.ok){var ed=await ex.json();if(ed.access_token){SES={t:ed.access_token,r:ed.refresh_token};localStorage.setItem('ss_s',JSON.stringify({t:ed.access_token,r:ed.refresh_token}));history.replaceState(null,'',location.pathname);}}
  } else if(code){
    var ex=await fetch(S+'/auth/v1/token?grant_type=pkce',{method:'POST',headers:{'Content-Type':'application/json',apikey:AN},body:JSON.stringify({auth_code:code,code_verifier:sessionStorage.getItem('pkce_verifier')||''})});
    if(ex.ok){var ed=await ex.json();if(ed.access_token){SES={t:ed.access_token,r:ed.refresh_token};localStorage.setItem('ss_s',JSON.stringify({t:ed.access_token,r:ed.refresh_token}));history.replaceState(null,'',location.pathname);}}
  }
  if(!SES){sv('vl');return;}
  var ur=await fetch(S+'/auth/v1/user',{headers:{apikey:AN,Authorization:'Bearer '+SES.t}});
  if(!ur.ok){localStorage.removeItem('ss_s');SES=null;sv('vl');return;}
  UID=(await ur.json()).id;
  sv('vm');
  checkMatchesReleased();
  loadAtt();loadPicks();loadMe();
}

async function loadMe(){
  var r=await api('/rest/v1/profiles?id=eq.'+UID+'&select=id,first_name,image_url,photos,date_of_birth,gender');
  if(!r.ok)return;
  var d=await r.json();
  if(!d||!d.length)return;
  PRF=d[0];
  var ph=PRF.image_url||(PRF.photos&&PRF.photos[0])||'';
  var init=(PRF.first_name||'?')[0].toUpperCase();
  var w=document.getElementById('ppw');
  if(ph)w.innerHTML='<img class="pp" src="'+ph+'" alt="">';
  else document.getElementById('pph').textContent=init;
  if(PRF.date_of_birth)document.getElementById('pdob').value=PRF.date_of_birth;
  if(PRF.gender)document.getElementById('pgender').value=PRF.gender;
}

async function saveProfile(){
  var dob=document.getElementById('pdob').value;
  var gender=document.getElementById('pgender').value;
  var msg=document.getElementById('profmsg');
  var r=await fetch(S+'/rest/v1/profiles?id=eq.'+UID,{method:'PATCH',headers:hd({Prefer:'return=minimal'}),body:JSON.stringify({date_of_birth:dob||null,gender:gender||null})});
  if(r.ok){msg.innerHTML='<span style="color:#2e7d32">Saved!</span>';setTimeout(function(){msg.innerHTML=''},3000);}
  else{msg.innerHTML='<span style="color:#b71c1c">Error saving. Try again.</span>';}
}

async function upPhoto(inp){
  var file=inp.files[0];if(!file)return;
  var msg=document.getElementById('phm');
  msg.innerHTML='<span class="sp"></span>Uploading&hellip;';
  var fn=((PRF&&PRF.first_name)||'user').toLowerCase().replace(/\s+/g,'-');
  var path=fn+'-'+UID.slice(0,8)+'/photo-1.jpeg';
  var r=await fetch(S+'/storage/v1/object/profile-photos/'+path,{method:'POST',headers:{apikey:AN,Authorization:'Bearer '+SES.t,'Content-Type':file.type,'x-upsert':'true'},body:file});
  if(!r.ok){msg.innerHTML='<span style="color:#b71c1c">Upload failed. Try again.</span>';return;}
  var url=S+'/storage/v1/object/public/profile-photos/'+path;
  await fetch(S+'/rest/v1/profiles?id=eq.'+UID,{method:'PATCH',headers:hd({Prefer:'return=minimal'}),body:JSON.stringify({image_url:url})});
  document.getElementById('ppw').innerHTML='<img class="pp" src="'+url+'" alt="">';
  msg.innerHTML='<span style="color:#2e7d32">Photo saved!</span>';
  if(PRF)PRF.image_url=url;
}

async function loadAtt(){
  var r=await api('/rest/v1/rpc/event_attendees_for_caller',{method:'POST',body:JSON.stringify({p_event_id:EV})});
  var el=document.getElementById('al');
  if(!r.ok){el.innerHTML='<div class="empty">Could not load attendees.<br>Are you registered and checked in?</div>';return;}
  var d=await r.json();
  if(!d||!d.length){el.innerHTML='<div class="empty">No other checked-in attendees yet.</div>';return;}
  el.innerHTML=d.map(function(a){
    var ph=a.image_url||(a.photos&&a.photos[0])||'';
    var init=(a.first_name||'?')[0].toUpperCase();
    var av=ph?'<img class="av" src="'+ph+'" alt="">':'<div class="av">'+init+'</div>';
    return '<div class="row" id="r-'+a.id+'">'
      +'<div class="top">'+av+'<div><div style="font-size:15px;font-weight:600">'+(a.first_name||'Guest')+'</div></div></div>'
      +'<div class="opts">'
      +'<button class="opt" data-i="'+a.id+'" data-t="d" onclick="pk(\''+a.id+'\',\'d\')">&#10084; Date</button>'
      +'<button class="opt" data-i="'+a.id+'" data-t="f" onclick="pk(\''+a.id+'\',\'f\')">&#128075; Friend</button>'
      +'<button class="opt" data-i="'+a.id+'" data-t="n" onclick="pk(\''+a.id+'\',\'n\')">&#128683; Not again</button>'
      +'<button class="opt" data-i="'+a.id+'" data-t="x" onclick="pk(\''+a.id+'\',\'x\')">None</button>'
      +'</div></div>';
  }).join('');
  rfr();
}

async function loadPicks(){
  var r=await api('/rest/v1/event_picks?event_id=eq.'+EV+'&picker_id=eq.'+UID+'&select=picked_id,pick_type');
  if(!r.ok)return;
  var d=await r.json();
  PX={};
  d.forEach(function(p){
    var t=p.pick_type==='date'?'d':p.pick_type==='friend'?'f':p.pick_type==='not_again'?'n':'x';
    PX[p.picked_id]=t;
  });
  rfr();
}

function pk(id,t){if(PX[id]===t){delete PX[id];}else{PX[id]=t;}rfr();}

function rfr(){
  document.querySelectorAll('.opt').forEach(function(b){
    var i=b.dataset.i,t=b.dataset.t;
    b.className='opt';
    if(PX[i]===t)b.classList.add('s'+t);
    if(MATCHES_RELEASED){b.disabled=true;b.style.opacity='0.4';b.style.cursor='not-allowed';}
    else{b.disabled=false;b.style.opacity='';b.style.cursor='';}
  });
}

async function savePicks(){
  var b=document.getElementById('sb');
  b.disabled=true;b.innerHTML='<span class="sp"></span>Saving&hellip;';
  var ae=document.getElementById('pa');
  try{
    await fetch(S+'/rest/v1/event_picks?event_id=eq.'+EV+'&picker_id=eq.'+UID,{method:'DELETE',headers:hd()});
    var map={d:'date',f:'friend',n:'not_again',x:'none'};
    var rows=Object.entries(PX).filter(function(e){return e[1]!=='x';}).map(function(e){return{event_id:EV,picker_id:UID,picked_id:e[0],pick_type:map[e[1]]};});
    if(rows.length)await fetch(S+'/rest/v1/event_picks',{method:'POST',headers:hd({Prefer:'return=minimal'}),body:JSON.stringify(rows)});
    ae.innerHTML='<div class="al ok">Picks saved!</div>';
    setTimeout(function(){ae.innerHTML=''},3000);
  }catch(e){ae.innerHTML='<div class="al er">Error. Try again.</div>';}
  b.disabled=false;b.textContent='Save my picks';
}

async function loadMatches(){
  var mc=document.getElementById('mc');
  mc.innerHTML='<div class="card"><div class="empty" style="padding:2rem 0">&#10084;<br><br>Check back after the event for your matches!</div></div>';
  var r=await api('/rest/v1/matches?event_id=eq.'+EV+'&or=(user_id.eq.'+UID+',matched_user_id.eq.'+UID+')&status=eq.mutual&select=*');
  if(!r.ok){return;}
  var data=await r.json();
  if(!data||!data.length){return;}
  var seen=new Set();
  var deduped=data.filter(function(m){
    var oi=m.user_id===UID?m.matched_user_id:m.user_id;
    if(seen.has(oi))return false;
    seen.add(oi);return true;
  });
  var ids=deduped.map(function(m){return m.user_id===UID?m.matched_user_id:m.user_id;});
  var pr=await api('/rest/v1/profiles?id=in.('+ids.join(',')+')'+'&select=id,first_name,last_name,image_url');
  var ps=pr.ok?await pr.json():[];
  var bi={};ps.forEach(function(p){bi[p.id]=p;});
  mc.innerHTML='<div class="card" style="padding:.75rem 1.25rem">'+deduped.map(function(m){
    var oi=m.user_id===UID?m.matched_user_id:m.user_id;
    var p=bi[oi]||{};
    var lastInit=p.last_name?(p.last_name[0].toUpperCase()+'.') :'';
    var displayName=(p.first_name||'Your match')+(lastInit?' '+lastInit:'');
    var pl=m.match_type==='date'?'<span class="pill pd">Date</span>':m.match_type==='friend'?'<span class="pill pf">Friend</span>':'';
    return '<div class="mrow"><div style="display:flex;align-items:center;gap:8px">'+pl
      +'<span style="font-size:15px;font-weight:600">'+displayName+'</span>'
      +'</div><button class="cbtn" onclick="openChat(\''+oi+'\',\''+encodeURIComponent(displayName)+'\')">&#128172; Chat</button></div>';
  }).join('')+'</div>';
}

async function openChat(oid,name){
  ACH=oid;
  document.getElementById('ch-list').style.display='none';
  document.getElementById('ch').style.display='';
  if(!document.getElementById('pcc').style.display||document.getElementById('pcc').style.display==='none'){tab('c');}
  document.getElementById('ch').innerHTML=
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:1rem">'
    +'<button onclick="closeCh()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#999">&#8592;</button>'
    +'<span style="font-size:16px;font-weight:600">'+decodeURIComponent(name)+'</span></div>'
    +'<div id="ml" style="min-height:200px;max-height:320px;overflow-y:auto;margin-bottom:12px;display:flex;flex-direction:column"></div>'
    +'<div class="ci"><input type="text" id="mi" placeholder="Type a message&hellip;" onkeydown="if(event.key===\'Enter\')sendM(\''+oid+'\')"><button class="sb2" onclick="sendM(\''+oid+'\')">&#10148;</button></div>';
  loadMsgs(oid);
  if(window._cp)clearInterval(window._cp);
  window._cp=setInterval(function(){if(ACH===oid)loadMsgs(oid);},6000);
}

async function loadMsgs(oid){
  var r=await api('/rest/v1/messages?event_id=eq.'+EV+'&or=(and(sender_id.eq.'+UID+',recipient_id.eq.'+oid+'),and(sender_id.eq.'+oid+',recipient_id.eq.'+UID+'))&order=created_at.asc&select=*');
  var el=document.getElementById('ml');
  if(!el)return;
  if(!r.ok){el.innerHTML='<div class="empty">Could not load messages.</div>';return;}
  var msgs=await r.json();
  if(!msgs||!msgs.length){el.innerHTML='<div class="empty">No messages yet. Say hello!</div>';return;}
  var atBot=el.scrollHeight-el.scrollTop<=el.clientHeight+50;
  el.innerHTML=msgs.map(function(m){
    var mine=m.sender_id===UID;
    var t=new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    return '<div><div class="bbl '+(mine?'bm':'bt')+'">'+m.content+'</div><div class="ts">'+t+'</div></div>';
  }).join('');
  if(atBot)el.scrollTop=el.scrollHeight;
}

async function sendM(oid){
  var inp=document.getElementById('mi');
  var txt=inp&&inp.value&&inp.value.trim();
  if(!txt)return;
  inp.value='';
  await fetch(S+'/rest/v1/messages',{method:'POST',headers:hd({Prefer:'return=minimal'}),body:JSON.stringify({event_id:EV,sender_id:UID,recipient_id:oid,content:txt})});
  loadMsgs(oid);
}

async function loadChats(){
  var cl=document.getElementById('ch-list');
  var ch=document.getElementById('ch');
  if(ACH){return;} // already in a chat
  cl.innerHTML='<div class="empty"><span class="sp"></span></div>';
  ch.style.display='none';
  cl.style.display='';
  var r=await api('/rest/v1/matches?event_id=eq.'+EV+'&or=(user_id.eq.'+UID+',matched_user_id.eq.'+UID+')&status=eq.mutual&select=*');
  if(!r.ok||!(await r.clone().json()).length){cl.innerHTML='<div class="empty">No matches yet — check back after the event!</div>';return;}
  var data=await r.json();
  var seen=new Set();
  var deduped=data.filter(function(m){var oi=m.user_id===UID?m.matched_user_id:m.user_id;if(seen.has(oi))return false;seen.add(oi);return true;});
  var ids=deduped.map(function(m){return m.user_id===UID?m.matched_user_id:m.user_id;});
  var pr=await api('/rest/v1/profiles?id=in.('+ids.join(',')+')'+'&select=id,first_name,last_name,image_url');
  var ps=pr.ok?await pr.json():[];
  var bi={};ps.forEach(function(p){bi[p.id]=p;});
  cl.innerHTML='<div class="card" style="padding:.75rem 1.25rem">'+deduped.map(function(m){
    var oi=m.user_id===UID?m.matched_user_id:m.user_id;
    var p=bi[oi]||{};
    var lastInit=p.last_name?(p.last_name[0].toUpperCase()+'.') :'';
    var displayName=(p.first_name||'Match')+(lastInit?' '+lastInit:'');
    var ph=p.image_url?'<img class="av" src="'+p.image_url+'" alt="">':'<div class="av">'+(p.first_name||'?')[0].toUpperCase()+'</div>';
    var pl=m.match_type==='date'?'<span class="pill pd" style="font-size:10px">Date</span>':'<span class="pill pf" style="font-size:10px">Friend</span>';
    return '<div class="row" style="display:flex;align-items:center;gap:12px;cursor:pointer;padding:12px 0" onclick="openChat(''+oi+'',''+encodeURIComponent(displayName)+'')">'
      +ph
      +'<div style="flex:1"><div style="display:flex;align-items:center;gap:6px"><span style="font-size:15px;font-weight:600">'+displayName+'</span>'+pl+'</div>'
      +'<div style="font-size:13px;color:#999;margin-top:2px">Tap to chat</div></div>'
      +'<span style="color:#ccc;font-size:18px">&#8250;</span>'
      +'</div>';
  }).join('')+'</div>';
}

function closeCh(){
  ACH=null;
  if(window._cp)clearInterval(window._cp);
  document.getElementById('ch').style.display='none';
  document.getElementById('ch-list').style.display='';
  loadChats();
}

function tab(t){
  var panels={'p':'pp','m':'pm','c':'pcc','pr':'ppr'};
  var tabs={'p':'tp','m':'tm','c':'tc','pr':'tpr'};
  Object.keys(panels).forEach(function(n){
    document.getElementById(panels[n]).style.display=n===t?'':'none';
    document.getElementById(tabs[n]).classList.toggle('on',n===t);
  });
  if(t==='m')loadMatches();
  if(t==='c')loadChats();
}

function signOut(){localStorage.removeItem('ss_s');SES=null;UID=null;sv('vl');}

if('serviceWorker' in navigator){navigator.serviceWorker.register('/smitten-event-app/sw.js');}
init();
</script>
</body>
</html>
